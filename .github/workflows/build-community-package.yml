name: Build Community Package

on:
  push:
    branches: [main]
    paths:
      - "go_factory_generator/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/build-community-package.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Detect plugin version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          from pathlib import Path
          text = Path("go_factory_generator/constants.py").read_text(encoding="utf-8")
          m = re.search(r'PLUGIN_VERSION\s*=\s*"([^"]+)"', text)
          if not m:
              raise SystemExit("PLUGIN_VERSION not found")
          print(m.group(1))
          PY
          )
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Detected version: $VERSION"

      - name: Verify English-only public files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("go_factory_generator"), Path("README.md"), Path("CHANGELOG.md"),
                   Path("docs"), Path("install_windows.cmd"), Path("uninstall_windows.cmd")]
          bad = []
          for root in roots:
              files = [root] if root.is_file() else list(root.rglob("*"))
              for p in files:
                  if not p.is_file() or p.suffix.lower() not in {".py",".md",".txt",".cmd",".toml",".json",".yaml",".yml"}:
                      continue
                  text = p.read_text(encoding="utf-8", errors="strict")
                  for i, line in enumerate(text.splitlines(), 1):
                      if re.search(r"[\u0E00-\u0E7F]", line):
                          bad.append(f"{p}:{i}: {line}")
          if bad:
              print("\n".join(bad))
              raise SystemExit("Thai text remains in public extension files")
          print("English-only scan: PASS")
          PY

      - name: Compile Python sources
        run: python -m compileall -q go_factory_generator

      - name: Build Community ZIP
        shell: bash
        run: |
          rm -rf /tmp/go_factory_release
          mkdir -p /tmp/go_factory_release/go_factory_generator
          cp -R go_factory_generator/. /tmp/go_factory_release/go_factory_generator/
          find /tmp/go_factory_release -type d -name __pycache__ -prune -exec rm -rf {} +
          find /tmp/go_factory_release -type f -name "*.pyc" -delete
          cp LICENSE NOTICE /tmp/go_factory_release/go_factory_generator/
          mkdir -p dist
          rm -f "dist/go_factory_generator-v${VERSION}.zip"
          (
            cd /tmp/go_factory_release
            zip -qr "$GITHUB_WORKSPACE/dist/go_factory_generator-v${VERSION}.zip" go_factory_generator
          )

      - name: Verify ZIP contract and checksum
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, zipfile
          from pathlib import Path
          version = os.environ["VERSION"]
          p = Path(f"dist/go_factory_generator-v{version}.zip")
          data = p.read_bytes()
          sha = hashlib.sha256(data).hexdigest()
          with zipfile.ZipFile(p) as zf:
              names = [n for n in zf.namelist() if not n.endswith("/")]
              tops = {n.split("/")[0] for n in names}
              assert tops == {"go_factory_generator"}, tops
              assert "go_factory_generator/__init__.py" in names
              for n in names:
                  if n.endswith(".pyc") or "__pycache__" in n:
                      raise AssertionError(n)
          print("ZIP contract: PASS")
          print("SHA256:", sha)
          sums = Path("dist/SHA256SUMS.txt")
          existing = sums.read_text(encoding="utf-8").splitlines() if sums.exists() else []
          filename = p.as_posix()
          existing = [line for line in existing if not line.rstrip().endswith(filename)]
          existing.append(f"{sha}  {filename}")
          sums.write_text("\n".join(existing) + "\n", encoding="utf-8")
          PY

      - name: Upload Community package artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-factory-generator-v${{ env.VERSION }}
          path: |
            dist/go_factory_generator-v${{ env.VERSION }}.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Commit generated package
        if: github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "dist/go_factory_generator-v${VERSION}.zip" dist/SHA256SUMS.txt
          if git diff --cached --quiet; then
            echo "No package changes to commit."
            exit 0
          fi
          git commit -m "Build GO Factory Generator v${VERSION} community package"
          git push
